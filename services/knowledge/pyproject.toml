[project]
name = "content-studio-knowledge-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling[rapidocr]==2.140.0",
  "sentence-transformers==6.1.0",
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
  "torch==2.8.0+cpu",
  "torchvision==0.23.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
