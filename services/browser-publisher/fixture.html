<!doctype html><html lang="en"><meta charset="utf-8"><title>Isolated publishing fixture</title><meta name="account-id" content="123"><main><h1>Local publishing fixture</h1><label>Title <input id="title"></label><label>Body <textarea id="body"></textarea></label><label>Images <input type="file" id="images" multiple accept="image/*"></label><div id="image-ready"></div><label>Symbols <input id="symbols"></label><button id="submit" disabled>Submit fixture once</button><div id="receipt"></div></main><script>
const query=new URLSearchParams(location.search);let ready=false;let images=0;
const inputs=[document.querySelector('#body'),document.querySelector('#images')];
function update(){document.querySelector('#submit').disabled=!document.querySelector('#body').value||!ready;}
inputs[0].addEventListener('input',update);inputs[1].addEventListener('change',()=>{images=inputs[1].files.length;ready=false;document.querySelector('#image-ready').textContent='Uploading';setTimeout(()=>{if(query.get('scenario')==='incomplete')return;ready=true;document.querySelector('#image-ready').dataset.count=String(images);document.querySelector('#image-ready').textContent='Images ready';update();},120);});
document.querySelector('#submit').onclick=async()=>{document.querySelector('#submit').disabled=true;const reply=await fetch('/fixture/receipt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scenario:query.get('scenario'),accountId:document.querySelector('meta[name="account-id"]').content})});const receipt=await reply.json();document.querySelector('#receipt').textContent=JSON.stringify(receipt);};
</script></html>
